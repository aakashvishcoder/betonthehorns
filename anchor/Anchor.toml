skip_local_validator = true

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
horns_elo = "E4WuDUxqymTCF7rqQz4a4ZmVhWuQJe9Pbrmy7uia5Bbo"

[programs.devnet]
horns_elo = "E4WuDUxqymTCF7rqQz4a4ZmVhWuQJe9Pbrmy7uia5Bbo"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# ponytail: anchor build defaults to SBPF v3, which LiteSVM 0.10 can't load. Tests rebuild as v0
# (accepted on every cluster); deploy with `anchor build --arch v0`. Drop this once litesvm >= 0.18.
test = "cargo build-sbf --arch v0 --manifest-path programs/horns_elo/Cargo.toml --sbf-out-dir target/deploy && cargo test"

[hooks]
